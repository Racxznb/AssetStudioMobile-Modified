
name: Build Android APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract source
        run: |
          unzip -q "AssetStudioMobile-全选功能修改版.zip" -d source

      - name: Find project
        run: |
          GRADLE_FILE=$(find source -name gradlew -type f | head -n 1)
          if [ -z "$GRADLE_FILE" ]; then
            echo "找不到 gradlew 文件"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$GRADLE_FILE")" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AssetStudioMobile-APK
          path: source/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
